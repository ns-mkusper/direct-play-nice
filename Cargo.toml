[package]
name = "direct_play_nice"
description = "CLI program that converts video files to direct-play-compatible formats."
license = "GPL-3.0-only"
documentation = "https://github.com/ns-mkusper/direct-play-nice"
homepage = "https://github.com/ns-mkusper/direct-play-nice"
repository = "https://github.com/ns-mkusper/direct-play-nice"
version = "1.1.0-beta.9"
edition = "2021"


[features]
# Release builds link the vcpkg FFmpeg statically. Builds against a distro
# FFmpeg (tests/e2e/servarr/Dockerfile) turn this off with --no-default-features.
default = ["ffmpeg-static"]
ffmpeg-static = ["ffmpeg-next/static"]
ffmpeg-cli-tests = []


[dependencies]
anyhow = "1.0.86"
clap = { version = "4.5.9", features = ["derive"] }
cstr = "0.2.12"
env_logger = "0.11.3"
log = "0.4.22"
image = "0.25"
paddle-ocr-rs = { version = "0.6.1", default-features = false }
ort = { version = "=2.0.0-rc.10", default-features = false, features = [
  "std",
  "ndarray",
  "tracing",
  "load-dynamic",
] }
sha2 = "0.10"
serde_json = "1.0"
paste = "1.0"
# ffmpeg-next 9 tracks FFmpeg 9. ffmpeg-sys-next finds the vcpkg-built
# libraries through pkg-config (see .cargo/config.toml) and links them
# statically; the raw bindings are re-exported as `ffmpeg_next::sys`.
ffmpeg-next = { version = "9.0.0", default-features = false, features = [
  "codec",
  "format",
  "filter",
  "software-resampling",
  "software-scaling",
] }
serde = { version = "1.0.204", features = ["derive"] }
shlex = "1.3"
strum = "0.26.3"
strum_macros = "0.26.4"
syslog = "6.1.1"
toml = "0.8.16"
fs2 = "0.4"
libc = "0.2"
roxmltree = "0.20.0"
ureq = { version = "2.9.7", features = ["tls"] }
wordninja = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["cuda"] }

[target.'cfg(target_os = "windows")'.dependencies]
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["cuda", "directml"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["coreml"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"
mockito = "1.7.2"
strsim = "0.11"
criterion = "0.4"

[[bench]]
name = "ocr_benchmark"
harness = false

[[bench]]
name = "transcode_benchmark"
harness = false

[[bench]]
name = "resize_benchmark"
harness = false

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# Config for 'cargo dist'
[workspace.metadata.dist]
# The preferred cargo-dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.22.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# customize cargo-dist build env (install vcpkg and vcpkg build, etc)
# see: https://opensource.axo.dev/cargo-dist/book/ci/customizing.html#customizing-build-setup
github-build-setup = "../templates/build-setup.yml"

[workspace.metadata.dist.github-custom-runners]
global = "ubuntu-22.04"
aarch64-apple-darwin = "macos-15"
x86_64-apple-darwin = "macos-15-intel"
x86_64-pc-windows-msvc = "windows-2022"
x86_64-unknown-linux-gnu = "ubuntu-22.04"
aarch64-unknown-linux-gnu = "ubuntu-22.04-arm"

[package.metadata.vcpkg]
dependencies = [
  "ffmpeg[x264,vpx,freetype,fontconfig,nvcodec,dav1d]",
  "x264[asm,core]",
]
# Pins the vcpkg ffmpeg port at 9.0.2. x264 comes from the overlay port under
# vcpkg-overlays/ports regardless of the version upstream carries here.
git = "https://github.com/microsoft/vcpkg.git"
rev = "0699a19d0c6386247ce50d4dedbb8217d484d536"

[package.metadata.vcpkg.target.x86_64-unknown-linux-gnu]
triplet = "x64-linux"
dependencies = [
  "ffmpeg[x264,vpx,freetype,fontconfig,nvcodec,dav1d,vaapi]",
  "x264[asm,core]",
]

[package.metadata.vcpkg.target.aarch64-unknown-linux-gnu]
triplet = "arm64-linux"
dependencies = [
  "ffmpeg[x264,vpx,freetype,fontconfig,dav1d,vaapi]",
  "x264[asm,core]",
]

[package.metadata.vcpkg.target.x86_64-pc-windows-msvc]
triplet = "x64-windows-static"
dependencies = [
  "ffmpeg[x264,vpx,freetype,fontconfig,nvcodec,dav1d,qsv,amf]",
  "x264[asm,core]",
]

[package.metadata.vcpkg.target.x86_64-apple-darwin]
triplet = "x64-osx"
dependencies = [
  "ffmpeg[x264,vpx,freetype,fontconfig,dav1d]",
  "x264[asm,core]",
]

[package.metadata.vcpkg.target.aarch64-apple-darwin]
triplet = "arm64-osx"
dependencies = [
  "ffmpeg[x264,vpx,freetype,fontconfig,dav1d]",
  "x264[asm,core]",
]

[patch.crates-io]
# Keep the Rust-side ort 2.0.0-rc.10 API required by paddle-ocr-rs while
# allowing deployments to load the older ONNX Runtime 1.16 shared library.
ort = { git = "https://github.com/ns-mkusper/ort.git", rev = "16452198ebbbe0e7bd7a4bb2f6d488b4623f20b1" }
